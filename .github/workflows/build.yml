name: Build and Release Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Gerar o executável com PyInstaller
      run: |
        pyinstaller --noconsole --name "Simulador-Boteco-3D" main.py

    - name: Copiar Assets e Documentação
      run: |
        if (Test-Path assets) {
          Copy-Item -Path assets -Recurse -Destination dist\Simulador-Boteco-3D\assets
        }
        if (Test-Path README.md) {
          Copy-Item -Path README.md -Destination dist\Simulador-Boteco-3D\
        }
        if (Test-Path LICENSE) {
          Copy-Item -Path LICENSE -Destination dist\Simulador-Boteco-3D\
        }
        if (Test-Path CREDITS.md) {
          Copy-Item -Path CREDITS.md -Destination dist\Simulador-Boteco-3D\
        }

    - name: Compactar build em arquivo ZIP
      run: |
        Compress-Archive -Path dist\Simulador-Boteco-3D\* -DestinationPath dist\Simulador-Boteco-3D-Windows.zip

    - name: Upload do Artefato de Build (CI)
      uses: actions/upload-artifact@v4
      with:
        name: Simulador-Boteco-3D-Windows
        path: dist\Simulador-Boteco-3D-Windows.zip

    - name: Publicar Release no GitHub (Tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist\Simulador-Boteco-3D-Windows.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}